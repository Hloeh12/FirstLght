name: Build FirstLight IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test and bundle the offline engine
        run: |
          npm ci
          node scripts/check-release.mjs --previous
          npm test
          npm run build:console
      - name: Verify mobile viewport and offline interactions
        run: |
          npx playwright install chromium webkit
          node scripts/mobile-smoke.mjs
          FIRSTLIGHT_BROWSER=webkit node scripts/mobile-smoke.mjs
      - name: Detect Xcode
        shell: bash
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app/Contents/Developer
          selected="$(xcode-select -p)"
          if [[ ! -d "$selected/Platforms/iPhoneOS.platform" ]]; then
            selected="$(find /Applications -maxdepth 3 -path '/Applications/Xcode*.app/Contents/Developer' -type d | sort | tail -n 1)"
          fi
          test -d "$selected/Platforms/iPhoneOS.platform"
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$selected" xcodebuild -version
      - name: Generate project with XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          test -f ios-src/AppDelegate.swift
          test -f ios-src/Info.plist
          test -f ios-src/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          mkdir -p www/js www/assets/console
          cp index.html www/
          cp js/console.js www/js/
          rm -f www/js/rules.js
          cp assets/console/{design.css,credits.html} www/assets/console/
          xcodegen generate --spec project.yml
          xcodebuild -list -project FirstLight.xcodeproj
      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project FirstLight.xcodeproj -scheme FirstLight -sdk iphoneos -configuration Release -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build/xcodebuild.log
      - name: Validate and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Release-iphoneos/FirstLight.app
          test -f "$APP/FirstLight"
          test -f "$APP/www/index.html"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" | grep -qx FirstLight
          python3 - "$APP" <<'PY'
          import pathlib, plistlib, sys
          app = pathlib.Path(sys.argv[1])
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          import json, re
          release = json.loads(pathlib.Path('app-release.json').read_text())
          expected = dict(CFBundleDisplayName='FirstLght', CFBundleName='FirstLght', CFBundleIdentifier='com.firstlight.app', CFBundleShortVersionString=release['version'], CFBundleVersion=str(release['build']), LSRequiresIPhoneOS=True, MinimumOSVersion='15.0')
          for key, value in expected.items():
              assert info.get(key) == value, (key, info.get(key), value)
          catalog = app / 'Assets.car'
          assert catalog.is_file() and catalog.stat().st_size > 0, 'actool did not emit Assets.car'
          icon = info['CFBundleIcons']['CFBundlePrimaryIcon']
          assert icon.get('CFBundleIconName') == 'AppIcon', icon
          assert icon.get('CFBundleIconFiles'), icon
          for name in ['index.html', 'js/console.js', 'assets/console/design.css', 'assets/console/credits.html']:
              assert (app / 'www' / name).exists(), name
          console_path = app / 'www/js/console.js'
          console_text = console_path.read_text()
          decoded_console = re.sub(r'\\u\{([0-9a-fA-F]+)\}|\\u([0-9a-fA-F]{4})', lambda m: chr(int(m.group(1) or m.group(2), 16)), console_text)
          for marker in ['BAZI_FLOW_RULES', 'ZIWEI_FLOW_RULES', 'globalThis.BAZI_FLOW_RULES', 'globalThis.ZIWEI_FLOW_RULES', '甲木重主干', '冲去忌神破局发越', '羊陀夹忌候选']:
              assert marker in console_text or marker in decoded_console, 'compiled offline rules missing: ' + marker
          assert not (app / 'www/js/rules.js').exists(), 'rules.js must be bundled, not shipped as a sidecar'
          html = (app / 'www/index.html').read_text()
          assert '/js/console.js' in html and 'rules.js' not in html, 'index must load only the compiled console entry'
          PY
          mkdir -p build/Payload
          ditto "$APP" build/Payload/FirstLight.app
          (cd build && zip -qry FirstLight.ipa Payload)
          unzip -tq build/FirstLight.ipa
          unzip -p build/FirstLight.ipa Payload/FirstLight.app/Assets.car > build/PackagedAssets.car
          cmp "$APP/Assets.car" build/PackagedAssets.car
          IPA_NAME="$(node -p '"FirstLght-"+require("./app-release.json").version+"-build"+require("./app-release.json").build+".ipa"')"
          cp build/FirstLight.ipa "build/$IPA_NAME"
          echo "IPA_FILE=$IPA_NAME" >> "$GITHUB_ENV"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FirstLight-IPA-unsigned
          path: build/${{ env.IPA_FILE }}
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FirstLight-build-diagnostics
          path: |
            build/xcodebuild.log
            build/mobile-*.png
            FirstLight.xcodeproj/project.pbxproj
          if-no-files-found: ignore


