name: Build FirstLight IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test and bundle the offline engine
        run: |
          npm ci
          node scripts/check-release.mjs --previous
          npm test
          npm run build:console
      - name: Verify mobile viewport and offline interactions
        run: |
          npx playwright install chromium webkit
          node scripts/mobile-smoke.mjs
          # WebKit 在 macOS runner 上连跑三个视口会随机把主线程卡死（截图等字体、#moduleButton 点击、
          # 抽屉 summary 定位、#mainScrollView evaluate 各失败过一次，位置每次都不同；同一份代码
          # 本地 Windows WebKit 同版本跑三视口 8 分 50 秒全过，无法复现）。已试过把默认超时放宽到
          # 90s、每个视口重建浏览器进程，仍然复发。视口覆盖（320 换行 / 844 横屏）交给 chromium 三档，
          # WebKit 这一路只跑 390 验证引擎差异——离线、四体系、抽屉、TabBar 这些与引擎相关的检查一个不少。
          FIRSTLIGHT_VIEWPORTS=390x844 FIRSTLIGHT_BROWSER=webkit node scripts/mobile-smoke.mjs
      - name: Detect Xcode
        shell: bash
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app/Contents/Developer
          selected="$(xcode-select -p)"
          if [[ ! -d "$selected/Platforms/iPhoneOS.platform" ]]; then
            selected="$(find /Applications -maxdepth 3 -path '/Applications/Xcode*.app/Contents/Developer' -type d | sort | tail -n 1)"
          fi
          test -d "$selected/Platforms/iPhoneOS.platform"
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$selected" xcodebuild -version
      - name: Generate project with XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          test -f ios-src/AppDelegate.swift
          test -f ios-src/Info.plist
          test -f ios-src/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          python3 - <<'PY'
          from pathlib import Path
          rules = Path('www/js/rules.js').read_text()
          for marker in ['【冲去忌神·枯木逢春】', '【用神受制·惊涛骇浪】', '【双禄交驰·锦上添花】', '【禄逢冲破·吉处藏凶】', '【羊陀夹忌·动辄得咎】']:
              assert marker in rules, 'offline rules source missing: ' + marker
          PY
          mkdir -p www/js www/assets/console
          cp index.html www/
          cp js/console.js www/js/
          rm -f www/js/rules.js www/js/deep-*.js
          cp assets/console/design.css assets/console/liquid.css assets/console/credits.html www/assets/console/
          xcodegen generate --spec project.yml
          xcodebuild -list -project FirstLight.xcodeproj
      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project FirstLight.xcodeproj -scheme FirstLight -sdk iphoneos -configuration Release -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build/xcodebuild.log
      - name: Validate and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Release-iphoneos/FirstLight.app
          test -f "$APP/FirstLight"
          test -f "$APP/www/index.html"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" | grep -qx FirstLight
          python3 - "$APP" <<'PY'
          import pathlib, plistlib, sys
          app = pathlib.Path(sys.argv[1])
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          import json, re
          release = json.loads(pathlib.Path('app-release.json').read_text())
          expected = dict(CFBundleDisplayName='星谕', CFBundleName='FirstLight', CFBundleIdentifier='com.firstlight.app', CFBundleShortVersionString=release['version'], CFBundleVersion=str(release['build']), LSRequiresIPhoneOS=True, MinimumOSVersion='15.0')
          for key, value in expected.items():
              assert info.get(key) == value, (key, info.get(key), value)
          catalog = app / 'Assets.car'
          assert catalog.is_file() and catalog.stat().st_size > 0, 'actool did not emit Assets.car'
          icon = info['CFBundleIcons']['CFBundlePrimaryIcon']
          assert icon.get('CFBundleIconName') == 'AppIcon', icon
          assert icon.get('CFBundleIconFiles'), icon
          for name in ['index.html', 'js/console.js', 'assets/console/design.css', 'assets/console/liquid.css', 'assets/console/credits.html', 'PrivacyInfo.xcprivacy']:
              assert (app / 'www' / name).exists() or (app / name).exists(), name
          html = (app / 'www/index.html').read_text()
          assert '/js/console.js' in html and 'rules.js' not in html, 'index must load only the compiled entry'
          # 打包资源完整性：index.html 引用的每个本地样式/脚本都必须在包内存在
          for m in re.finditer(r'(?:href|src)="(/[^"]+|\.\/[^"]+)"', html):
              ref = m.group(1).lstrip('./')
              if ref.startswith('http') or ref.startswith('firstlight://'):
                  continue
              assert (app / 'www' / ref).exists(), 'index.html references missing asset: ' + ref
          assert not any((app / 'www/js').glob('deep-*.js')), 'deep-*.js source copies must not ship in the IPA'
          console_path = app / 'www/js/console.js'
          console_text = console_path.read_text()
          decoded_console = re.sub(r'\\u\{([0-9a-fA-F]+)\}|\\u([0-9a-fA-F]{4})', lambda m: chr(int(m.group(1) or m.group(2), 16)), console_text)
          for marker in ['BAZI_FLOW_RULES', 'ZIWEI_FLOW_RULES', 'globalThis.BAZI_FLOW_RULES', 'globalThis.ZIWEI_FLOW_RULES', '甲木参天']:
              assert marker in console_text or marker in decoded_console, 'compiled offline rules missing: ' + marker
          assert not (app / 'www/js/rules.js').exists(), 'rules.js must be bundled, not shipped as a sidecar'
          PY
          mkdir -p build/Payload
          ditto "$APP" build/Payload/FirstLight.app
          (cd build && zip -qry FirstLight.ipa Payload)
          unzip -tq build/FirstLight.ipa
          unzip -p build/FirstLight.ipa Payload/FirstLight.app/Assets.car > build/PackagedAssets.car
          cmp "$APP/Assets.car" build/PackagedAssets.car
          IPA_NAME="$(node -p '"FirstLight-"+require("./app-release.json").version+"-build"+require("./app-release.json").build+".ipa"')"
          cp build/FirstLight.ipa "build/$IPA_NAME"
          echo "IPA_FILE=$IPA_NAME" >> "$GITHUB_ENV"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FirstLight-IPA-unsigned
          path: build/${{ env.IPA_FILE }}
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FirstLight-build-diagnostics
          path: |
            build/xcodebuild.log
            build/mobile-*.png
            FirstLight.xcodeproj/project.pbxproj
          if-no-files-found: ignore


