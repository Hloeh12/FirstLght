<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星谕 · 来源与许可</title><link rel="stylesheet" href="./design.css"><main id="screen"><h1>来源与许可</h1>
<article class="card"><h2>专业星历</h2><p>十大行星由 <a href="https://github.com/cosinekitty/astronomy">Astronomy Engine</a> 计算。凯龙和四大小行星使用 <a href="https://ssd.jpl.nasa.gov/horizons/">NASA JPL Horizons</a> 日心轨道根数进行局部传播，标注为近似位置。恒星黄道采用 J2000 岁差基准加历元进动。</p></article>
<article class="card"><h2>传统资料</h2><p>称骨权重和传统歌诀表经 <a href="https://github.com/hankwu61/lunarcalendar">lunarcalendar</a> 校订，按 MIT 许可使用。卦辞和爻辞采用公开《周易》原文，参照 <a href="https://github.com/bollwarm/ZHOUYI">ZHOUYI</a>。起卦口径参照 <a href="https://zh.wikisource.org/wiki/梅花易數/卷一">《梅花易数》卷一</a>。</p><p>黄历使用 lunar-javascript。紫微计算使用 Renhuai 与 iztro，流派选择和校准结果在对应盘面显示。</p></article>
