<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#f7f6fb">
 <meta name="firstlight-console" content="professional">
 <title>星谕 First Light</title>
 <link rel="stylesheet" href="/assets/console/design.css">
 <link rel="stylesheet" href="/assets/console/liquid.css">
</head>
<body>
 <div id="app">
  <header id="appTopBar" class="chrome liquid-glass">
   <button type="button" class="avatar-key" id="caseDrawerButton" aria-label="快捷案例" aria-haspopup="dialog"><span class="avatar-mark" id="avatarMark">星</span></button>
   <div class="profile-pill profile-capsule" id="activeProfile">
    <div class="capsule-left">
     <span class="page-title" id="pageTitle">排盘</span>
     <span class="page-sub"><span data-profile-name id="curName">开始排盘</span><span data-profile-dst hidden></span><span data-profile-rule id="curBaZi" hidden></span></span>
    </div>
   </div>
   <div class="topbar-actions">
    <button type="button" class="icon instant-top" id="instantTop" aria-label="即刻天象" hidden>⏱</button>
    <button type="button" class="icon" id="toolsButton" aria-label="当前页面功能" aria-haspopup="dialog" hidden>&#8226;&#8226;&#8226;</button>
    <button type="button" class="gear-key" id="configButton" aria-label="配置" aria-haspopup="dialog"><svg viewBox="0 0 20 20" aria-hidden="true" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.4 6.6h13.2M3.4 13.4h13.2"/><circle cx="7.6" cy="6.6" r="1.9" fill="#fff"/><circle cx="12.4" cy="13.4" r="1.9" fill="#fff"/></svg></button>
   </div>
  </header>
  <main id="mainScrollView" aria-label="主内容">
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <div class="chart-basis-row" id="chartBasisRow" hidden><p id="chartBasisTime" class="chart-basis-time thin"></p><button type="button" class="chart-time-action" id="instantToggle" data-chart-action="instant">⏱ 即刻天象</button></div>
  <div id="screen" tabindex="-1" data-screen-tab="chart"></div>
  <div class="bottom-spacer" style="height:190px;width:100%;min-height:190px;flex-shrink:0;pointer-events:none" aria-hidden="true"></div>
  </main>
  <div class="dock-rail" id="chartSystemSwitch" hidden>
   <button type="button" class="rail-grid" id="moduleButton" aria-label="全部模块" aria-haspopup="dialog"><span class="rail-grid-label" aria-hidden="true">模块</span></button>
   <span class="dock-now" id="dockNowSystem" aria-live="polite" hidden>八字</span>
  </div>
  <nav id="bottomNav" class="liquid-bottom-nav" aria-label="主导航">
   <div id="tabLiquidPill" class="tab-liquid-pill" aria-hidden="true"></div>
   <button type="button" class="nav-tab-item" data-tab="cases"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.6" width="11" height="8.4" rx="2.2"/><path d="M4.6 2.4h6.8"/></svg></span><span class="tab-label">案例</span></button>
   <button type="button" class="nav-tab-item active" data-tab="chart"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/><path d="M8 3.2v9.6M3.2 8h9.6"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/></svg></span><span class="tab-label">排盘</span></button>
   <button type="button" class="nav-tab-item" data-tab="period"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8.4" r="5.4"/><path d="M8 5.1v3.6l2.4 1.5M8 1.9v1.3M14.1 8.4h-1.3"/></svg></span><span class="tab-label">时点</span></button>
   <button type="button" class="nav-tab-item" data-tab="insights"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M1.9 8S4.1 4.3 8 4.3 14.1 8 14.1 8 11.9 11.7 8 11.7 1.9 8 1.9 8z"/><circle cx="8" cy="8" r="1.8"/></svg></span><span class="tab-label">洞见</span></button>
   <button type="button" class="nav-tab-item" data-tab="me"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.9" r="2.5"/><path d="M3.6 13.3c.5-2.3 2.2-3.5 4.4-3.5s3.9 1.2 4.4 3.5"/></svg></span><span class="tab-label">我</span></button>
  </nav>
 </div>
 <dialog id="inputSheet" class="sheet liquid-glass" aria-labelledby="birthTitle"></dialog>
 <dialog id="caseDrawer" class="drawer liquid-glass" aria-labelledby="drawerTitle"></dialog>
 <dialog id="toolSheet" class="sheet liquid-glass" aria-labelledby="toolTitle"></dialog>
 <dialog id="termSheet" class="sheet liquid-glass" aria-labelledby="termTitle"></dialog>
 <dialog id="configSheet" class="sheet liquid-glass config-sheet" aria-labelledby="configTitle"></dialog>
 <dialog id="moduleSheet" class="sheet liquid-glass module-sheet" aria-labelledby="moduleTitle"></dialog>
 <dialog id="reportSheet" class="drawer report-sheet liquid-glass" aria-labelledby="reportTitle"></dialog>
 <script defer src="/js/console.js"></script>
</body>
</html>
