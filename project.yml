name: FirstLight
options:
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: com.firstlight.app
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  FirstLight:
    type: application
    platform: iOS
    sources:
      - path: ios-src/AppDelegate.swift
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: FirstLight
        INFOPLIST_FILE: ios-src/Info.plist
        GENERATE_INFOPLIST_FILE: NO
schemes:
  FirstLight:
    build:
      targets:
        FirstLight: all
