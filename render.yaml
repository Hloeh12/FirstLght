services:
  - type: web
    name: firstlight
    runtime: node
    plan: free
    repo: https://github.com/Hloeh12/FirstLght
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
